name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAX_PLATFORMS: cpu
  UV_LOCKED: "1"
  # JAX's persistent compilation cache, kept between runs (actions/cache below): most of the unit
  # tier's time is XLA compilation of small programs, not running them
  JAX_COMPILATION_CACHE_DIR: /home/runner/.cache/jax-compilation
  JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra port
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # @process functions get every function rule (AJ001-AJ007, AJ020, AJ021), every other function
      # under processes/ (the numerical kernels) AJ001-AJ003, AJ006, AJ007, AJ020 and AJ021, and the
      # file rules AJ008-AJ012 check every file of their layers (AJ009 and AJ011 are reported but not
      # enforced by --strict) (AJ020: a NumPy call on a traced value, use jnp; AJ021: an argument
      # changed in place, return a new state; AJ006: a Python loop over a shape-derived range or
      # an array, i.e. an unrolled layer loop; use depth_scan; AJ007: a bare numeric literal, use
      # a labelled coefficient or a core.units adapter); the summary line prints how many
      # functions were visited, and tests/unit/test_lint.py fails if the process code is not covered
      - run: uv run python -m agrijax.core.lint src/agrijax --strict

  unit:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        x64: ["1"]
        include:
          # second pass with float32 only, tolerance relaxed inside the tests
          - python: "3.12"
            x64: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra dev --extra port
      # newest cache of this job's configuration; a new entry is saved at the end of every run
      - uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/jax-compilation
          key: jax-cc-${{ runner.os }}-py${{ matrix.python }}-x64${{ matrix.x64 }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            jax-cc-${{ runner.os }}-py${{ matrix.python }}-x64${{ matrix.x64 }}-${{ hashFiles('uv.lock') }}-
      # the unit tier is data-free (tests/conftest.py rejects a unit test that asks for data_dir);
      # AGRI_JAX_NO_SKIP=1 turns any skip not marked @pytest.mark.allow_skip into a failure, so
      # a reader test cannot silently skip here
      # two processes (with four, the 3.11 runner was stopped twice at the same point, most likely out
      # of memory), test files kept together on a worker; coverage only in the job that uploads it;
      # the 25 slowest tests are listed at the end
      - run: >-
          uv run pytest tests/unit -q -rs -n 2 --dist loadfile --durations=25
          ${{ (matrix.python == '3.12' && matrix.x64 == '1') && '--cov=agrijax --cov-report=xml' || '' }}
        env:
          AGRI_JAX_X64: ${{ matrix.x64 }}
          AGRI_JAX_CHECK: "1"
          AGRI_JAX_NO_SKIP: "1"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: /home/runner/.cache/jax-compilation
          key: jax-cc-${{ runner.os }}-py${{ matrix.python }}-x64${{ matrix.x64 }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
      - uses: codecov/codecov-action@v4
        if: matrix.python == '3.12' && matrix.x64 == '1'
        with:
          files: coverage.xml
        continue-on-error: true

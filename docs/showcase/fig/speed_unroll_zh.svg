<svg xmlns="http://www.w3.org/2000/svg" class="ajfig ajfig" viewBox="0 0 1000 640" role="img" aria-labelledby="speed-unroll-zh-t speed-unroll-zh-d">
<title id="speed-unroll-zh-t">GPU：定位瓶颈、调整程序布局、核对模型不变</title>
<desc id="speed-unroll-zh-d">H100 上层循环与展开层的成对条形图：1e5 个季时每日内核数由 489 降至 63，空闲比例由 34 % 降至 1.9 %，稳定调用快 3.1 倍，编译与首次运行变长。</desc>

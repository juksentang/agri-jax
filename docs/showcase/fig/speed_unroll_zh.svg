<text x="510.0" y="406.0" class="k">模型不变。GPU 展开版与 CPU 相比：65 个运行中阶段日期全部一</text>
<text x="510.0" y="428.0" class="k">致，产量最多相差 1.4e-15（相对）。GPU 上展开与循环相比：产量、</text>

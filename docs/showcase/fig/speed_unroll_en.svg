.ajfig.ajfig .srust{stroke:var(--f-rust);fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ajfig.ajfig .ring{stroke:var(--f-bg);stroke-width:2}
.ajfig.ajfig .w4{stroke-width:4}
.ajfig.ajfig .w15{stroke-width:1.5}
.ajfig.ajfig .soft{opacity:.55}
</style>
<rect width="1000" height="640" rx="2" class="bg"/>
<text x="28.0" y="40.0" class="s20 k b">GPU: find the bottleneck, change the layout, check the model</text>
<text x="28.0" y="64.0" class="m">One H100, float64, the 65-run acceptance task replicated to B seasons; six programs.</text>
<rect x="760.0" y="54.0" width="14.0" height="10.0" rx="2" class="fneu"/>
<text x="782.0" y="64.0" class="k">layer loops</text>
<rect x="884.5" y="54.0" width="14.0" height="10.0" rx="2" class="fteal"/>
<text x="906.5" y="64.0" class="k">unrolled</text>
<text x="28.0" y="96.0" class="s17 k b">1  Profile: short kernels and idle gaps</text>
<text x="536.0" y="96.0" class="s17 k b">2  Result: steady call, six programs</text>
<line x1="28.0" y1="104.0" x2="972.0" y2="104.0" class="grid"/>
<text x="28.0" y="122.0" class="k w">Kernels per simulated day</text>

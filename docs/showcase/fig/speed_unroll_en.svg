<text x="59.5" y="160.3" text-anchor="middle" class="n k h">488</text>
<path d="M87.0,276.0V266.4A4.0,4.0 0 0 1 91.0,262.4H126.1A4.0,4.0 0 0 1 130.1,266.4V276.0Z" class="fteal"/>
<text x="108.5" y="256.4" text-anchor="middle" class="n k h">60</text>
<text x="84.0" y="296.0" text-anchor="middle" class="m">B = 1e4</text>
<path d="M149.9,276.0V169.9A4.0,4.0 0 0 1 153.9,165.9H189.0A4.0,4.0 0 0 1 193.0,169.9V276.0Z" class="fneu"/>
<text x="171.5" y="159.9" text-anchor="middle" class="n k h">489</text>
<path d="M199.0,276.0V265.8A4.0,4.0 0 0 1 203.0,261.8H238.1A4.0,4.0 0 0 1 242.1,265.8V276.0Z" class="fteal"/>
<text x="220.5" y="255.8" text-anchor="middle" class="n k h">63</text>
<text x="196.0" y="296.0" text-anchor="middle" class="m">B = 1e5</text>
<text x="282.0" y="122.0" class="k w">Device idle between kernels</text>
<line x1="282.0" y1="276.0" x2="506.0" y2="276.0" class="axis"/>
<path d="M291.9,276.0V179.6A4.0,4.0 0 0 1 295.9,175.6H331.0A4.0,4.0 0 0 1 335.0,179.6V276.0Z" class="fneu"/>
<text x="313.5" y="169.6" text-anchor="middle" class="n k h">44.6 %</text>
<path d="M341.0,276.0V272.9A3.1,3.1 0 0 1 344.1,269.7H380.9A3.1,3.1 0 0 1 384.1,272.9V276.0Z" class="fteal"/>
<text x="362.5" y="263.7" text-anchor="middle" class="n k h">2.8 %</text>
<text x="338.0" y="296.0" text-anchor="middle" class="m">B = 1e4</text>
<path d="M403.9,276.0V204.4A4.0,4.0 0 0 1 407.9,200.4H443.0A4.0,4.0 0 0 1 447.0,204.4V276.0Z" class="fneu"/>
<text x="425.5" y="194.4" text-anchor="middle" class="n k h">33.6 %</text>
<path d="M453.0,276.0V273.9A2.1,2.1 0 0 1 455.1,271.7H493.9A2.1,2.1 0 0 1 496.1,273.9V276.0Z" class="fteal"/>
<text x="474.5" y="265.7" text-anchor="middle" class="n k h">1.9 %</text>
<text x="450.0" y="296.0" text-anchor="middle" class="m">B = 1e5</text>
<text x="536.0" y="122.0" class="k w">Seconds per call</text>
<line x1="536.0" y1="276.0" x2="972.0" y2="276.0" class="axis"/>
<path d="M586.0,276.0V192.0A4.0,4.0 0 0 1 590.0,188.0H638.0A4.0,4.0 0 0 1 642.0,192.0V276.0Z" class="fneu"/>
<text x="614.0" y="182.0" text-anchor="middle" class="n k h">1.12 s</text>
<path d="M648.0,276.0V251.3A4.0,4.0 0 0 1 652.0,247.3H700.0A4.0,4.0 0 0 1 704.0,251.3V276.0Z" class="fteal"/>
<text x="676.0" y="241.3" text-anchor="middle" class="n k h">0.36 s</text>
<text x="645.0" y="296.0" text-anchor="middle" class="m">B = 1e4</text>
<text x="645.0" y="316.0" text-anchor="middle" class="k w">3.1× faster</text>
<path d="M804.0,276.0V176.9A4.0,4.0 0 0 1 808.0,172.9H856.0A4.0,4.0 0 0 1 860.0,176.9V276.0Z" class="fneu"/>
<text x="832.0" y="166.9" text-anchor="middle" class="n k h">1.31 s</text>
<path d="M866.0,276.0V246.6A4.0,4.0 0 0 1 870.0,242.6H918.0A4.0,4.0 0 0 1 922.0,246.6V276.0Z" class="fteal"/>
<text x="894.0" y="236.6" text-anchor="middle" class="n k h">0.42 s</text>
<text x="863.0" y="296.0" text-anchor="middle" class="m">B = 1e5</text>
<text x="863.0" y="316.0" text-anchor="middle" class="k w">3.1× faster</text>
<text x="28.0" y="360.0" class="s17 k b">3  Cost, and the check that the model is unchanged</text>
<line x1="28.0" y1="368.0" x2="972.0" y2="368.0" class="grid"/>
<text x="28.0" y="386.0" class="k w">Seconds at B = 1e5</text>
<line x1="28.0" y1="520.0" x2="468.0" y2="520.0" class="axis"/>
<path d="M42.3,520.0V502.2A4.0,4.0 0 0 1 46.3,498.2H94.3A4.0,4.0 0 0 1 98.3,502.2V520.0Z" class="fneu"/>
<text x="70.3" y="492.2" text-anchor="middle" class="n k h">19.0 s</text>
<path d="M104.3,520.0V446.4A4.0,4.0 0 0 1 108.3,442.4H156.3A4.0,4.0 0 0 1 160.3,446.4V520.0Z" class="fteal"/>
<text x="132.3" y="436.4" text-anchor="middle" class="n k h">67.4 s</text>
<text x="101.3" y="540.0" text-anchor="middle" class="m">XLA compile</text>
<path d="M189.0,520.0V490.9A4.0,4.0 0 0 1 193.0,486.9H241.0A4.0,4.0 0 0 1 245.0,490.9V520.0Z" class="fneu"/>
<text x="217.0" y="480.9" text-anchor="middle" class="n k h">28.7 s</text>
<path d="M251.0,520.0V434.7A4.0,4.0 0 0 1 255.0,430.7H303.0A4.0,4.0 0 0 1 307.0,434.7V520.0Z" class="fteal"/>
<text x="279.0" y="424.7" text-anchor="middle" class="n k h">77.5 s</text>
<text x="248.0" y="540.0" text-anchor="middle" class="m">first run</text>
<path d="M335.7,520.0V511.1A4.0,4.0 0 0 1 339.7,507.1H387.7A4.0,4.0 0 0 1 391.7,511.1V520.0Z" class="fneu"/>
<text x="363.7" y="501.1" text-anchor="middle" class="n k h">11.2 s</text>
<path d="M397.7,520.0V507.4A4.0,4.0 0 0 1 401.7,503.4H449.7A4.0,4.0 0 0 1 453.7,507.4V520.0Z" class="fteal"/>
<text x="425.7" y="497.4" text-anchor="middle" class="n k h">14.4 s</text>
<text x="394.7" y="540.0" text-anchor="middle" class="m">warm start</text>
<text x="510.0" y="406.0" class="k">Same model. GPU unrolled against CPU: stage dates identical</text>
<text x="510.0" y="428.0" class="k">in 65 of 65 runs, yield differs by at most 1.4e-15</text>
<text x="510.0" y="450.0" class="k">(relative). Unrolled against loops on the GPU: yield, soil</text>
<text x="510.0" y="472.0" class="k">water, runoff and drainage bit for bit; 17 of 65 runs bit for</text>
<text x="510.0" y="494.0" class="k">bit in every output, the rest differ in the last bits</text>
<text x="510.0" y="516.0" class="k">(largest: biomass 4.5e-13 kg ha⁻¹).</text>
</svg>

.ajfig.ajfig text.m{fill:var(--f-mut)}
.ajfig.ajfig text.n{font-family:"IBM Plex Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.ajfig.ajfig text.b{font-weight:700}
.ajfig.ajfig text.w{font-weight:500}

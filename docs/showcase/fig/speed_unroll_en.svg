<svg xmlns="http://www.w3.org/2000/svg" class="ajfig ajfig" viewBox="0 0 1000 640" role="img" aria-labelledby="speed-unroll-en-t speed-unroll-en-d">
<title id="speed-unroll-en-t">GPU: find the bottleneck, change the layout, check the model</title>
<desc id="speed-unroll-en-d">Paired bars for layer loops and unrolled layers on the H100: kernels per day 489 to 63 at 1e5 seasons, idle share 34 % to 1.9 %, steady call 3.1 times faster, compile and first run longer.</desc>
<style>
svg.ajfig.ajfig{--f-bg:var(--panel,#E6E9E3);--f-ink:var(--ink,#16201C);--f-mut:var(--muted,#56625D);--f-rule:var(--rule,#C8CEC7);--f-neu:var(--neutral,#B9C0B7);--f-teal:var(--teal,#0F8A66);--f-rust:var(--rust,#C2591A);--f-violet:var(--violet,#6B4FBB);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
@media (prefers-color-scheme:dark){svg.ajfig.ajfig{--f-bg:var(--panel,#1A201D);--f-ink:var(--ink,#E8EBE5);--f-mut:var(--muted,#97A29C);--f-rule:var(--rule,#2E3632);--f-neu:var(--neutral,#48504C);--f-teal:var(--teal,#2FA582);--f-rust:var(--rust,#D96A28);--f-violet:var(--violet,#8E78D8)}}
.ajfig.ajfig text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:var(--f-mut);font-size:15px;white-space:pre}

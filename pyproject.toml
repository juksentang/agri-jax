[project]
name = "agrijax"
version = "0.0.1"
description = "Differentiable, batch-parallel field-scale crop-soil process models in JAX (CERES-Maize + RZWQM-style soil water and PET)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Juk-Sen TANG", email = "juksen.tang@mail.mcgill.ca" }]
keywords = ["jax", "differentiable", "crop model", "DSSAT", "RZWQM", "CERES-Maize", "agriculture"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "jax>=0.8,<0.12",
  "equinox>=0.13",
  "jaxtyping",
  "numpy",
  "pandas",
  "xarray",
  "pyyaml",
  "scipy",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.8,<0.12"]
calib = ["optax", "optimistix", "lineax", "blackjax", "numpyro", "salib", "arviz"]
report = ["jinja2"]
port = ["fparser>=0.2.5"]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-regressions",
  "hypothesis",
  "pytest-benchmark",
  "chex",
  "beartype",
  "ruff",
  "pyright",
  "pre-commit",
  "pyet",
  "pyarrow",
]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/juksentang/agri-jax"
Documentation = "https://juksentang.github.io/agri-jax"

[project.entry-points."agrijax.conformance"]
# this repository's conformance cases, through the same entry point a plugin uses
agrijax = "agrijax.testing.conformance.discover:builtin_cases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agrijax"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "README.zh.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "CITATION.cff", "pyproject.toml"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["poc", "dist", "docs", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
ignore = [
  "E741",   # ambiguous variable names: physics uses l, I, O legitimately
  "RUF012", # mutable class attributes: equinox modules
  "B905",   # zip without strict: fine on py311+ but noisy
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E501"]
"src/agrijax/core/lint.py" = ["UP"]

[tool.ruff.lint.isort]
known-first-party = ["agrijax"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# pyright
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", ".venv", "poc", "dist"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
pythonVersion = "3.11"
reportMissingImports = true
reportMissingTypeStubs = false
reportPrivateImportUsage = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: pure-function tests, no data (every push)",
  "diff: differential tests against Fortran dumps; skipped when dumps are absent",
  "integration: whole-model comparison on scenario directories (PR + nightly)",
  "gpu: GPU-only throughput and vmap tests (manual label + weekly)",
  "slow: takes more than a few seconds",
]
filterwarnings = [
  "ignore::DeprecationWarning:jax.*",
]

[tool.coverage.run]
source = ["agrijax"]
branch = true
